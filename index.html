<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎵 牧童笛星級小大師 - 練習紀錄系統</title>
    <style>
        :root {
            --primary: #2c7a7b; --primary-light: #e6fffa; --secondary: #d69e2e; --secondary-light: #fefcbf;
            --dark: #2d3748; --light: #f7fafc; --white: #ffffff; --success: #38a169; --error: #e53e3e;
            --warning-bg: #fffaf0; --warning-border: #fbd38d;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #f0f7f6; margin: 0; padding: 15px; color: var(--dark); }
        .app-container { max-width: 1000px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 20px; }
        header h1 { color: var(--primary); margin: 5px 0; font-size: 2rem; }
        header p { color: #718096; margin: 0; }
        .grid-layout { display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 768px) { .grid-layout { grid-template-columns: 1.2fr 1fr; } }
        .card { background: var(--white); border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); padding: 20px; }
        .card-title { color: var(--primary); font-size: 1.25rem; margin: 0 0 18px 0; display: flex; align-items: center; gap: 8px; border-bottom: 2px solid var(--primary-light); padding-bottom: 10px; }
        .form-group { margin-bottom: 18px; }
        .form-row { display: flex; gap: 12px; }
        .form-row .form-group { flex: 1; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.95rem; }
        input[type="text"], input[type="number"], textarea { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 1rem; transition: all 0.3s; outline: none; background-color: var(--light); }
        input:focus, textarea:focus { border-color: var(--primary); background-color: var(--white); box-shadow: 0 0 0 3px rgba(44, 122, 123, 0.15); }
        input[readonly] { background-color: #edf2f7; cursor: not-allowed; }
        .star-rating { display: flex; flex-direction: row-reverse; justify-content: flex-end; gap: 8px; }
        .star-rating input { display: none; }
        .star-rating label { font-size: 36px; color: #cbd5e0; cursor: pointer; transition: color 0.15s ease-in-out; margin: 0; }
        .star-rating input:checked ~ label, .star-rating label:hover, .star-rating label:hover ~ label { color: #f6e05e; }
        .recorder-box { background: #ebf8fa; border: 2px dashed #b2f5ea; border-radius: 12px; padding: 18px; text-align: center; margin-bottom: 20px; }
        .recorder-status { font-weight: bold; color: var(--primary); margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-group { display: flex; gap: 10px; justify-content: center; margin-bottom: 12px; }
        button { padding: 12px 20px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 1rem; }
        .btn-record { background-color: var(--error); color: var(--white); }
        .btn-stop { background-color: #4a5568; color: var(--white); }
        .btn-submit { background-color: var(--primary); color: var(--white); width: 100%; padding: 14px; font-size: 1.1rem; justify-content: center; border-radius: 10px; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        audio { width: 100%; margin-top: 8px; }
        .history-card { margin-top: 20px; }
        .stats-dashboard { display: none; gap: 10px; margin-bottom: 18px; background: var(--primary-light); padding: 12px; border-radius: 12px; justify-content: space-around; text-align: center; border: 1px solid #b2f5ea;}
        .stat-item { flex: 1; }
        .stat-val { font-size: 1.6rem; font-weight: bold; color: var(--primary); }
        .stat-lbl { font-size: 0.8rem; color: #4a5568; font-weight: 600; }
        .history-list { margin-top: 12px; max-height: 350px; overflow-y: auto; padding-right: 5px;}
        .history-item { background: var(--light); border-left: 4px solid var(--primary); padding: 12px 14px; border-radius: 0 8px 8px 0; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .history-stars { color: #f6e05e; font-size: 1.1rem; }
        .no-records { text-align: center; color: #a0aec0; padding: 20px 0; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>🎵 牧童笛星級小大師</h1>
        <p>持之以恆，每天練習 5 分鐘，成為笛藝大師！</p>
    </header>
    <div class="card">
        <h3 class="card-title">📝 今日練習登記</h3>
        <form id="recordForm">
            <div class="form-row">
                <div class="form-group"><label for="className">🏫 班別</label><input type="text" id="className" placeholder="例如：4A" required></div>
                <div class="form-group"><label for="studentName">👤 學生姓名</label><input type="text" id="studentName" placeholder="例如：陳大文" required></div>
            </div>
            <div class="form-group"><label>📅 練習日期</label><input type="text" id="todayDate" readonly></div>
            <div class="form-group"><label for="practiceTime">⏱️ 練習時間 (分鐘)</label><input type="number" id="practiceTime" min="5" placeholder="最少 5 分鐘" required></div>
            <div class="form-group"><label for="practiceContent">📝 練習內容</label><textarea id="practiceContent" rows="3" placeholder="例如：吹奏 C4-C5 音階" required></textarea></div>
            <div class="recorder-box">
                <div class="recorder-status"><span>🎙️ 錄下我的演奏 (選填)</span></div>
                <div class="btn-group">
                    <button type="button" id="startBtn" class="btn-record">🔴 開始錄音</button>
                    <button type="button" id="stopBtn" class="btn-stop" disabled>⏹️ 停止</button>
                </div>
                <audio id="audioPlayback" controls></audio>
            </div>
            <div class="form-group">
                <label>⭐ 自評今天表現</label>
                <div class="star-rating">
                    <input type="radio" id="star5" name="rating" value="5" required><label for="star5">★</label>
                    <input type="radio" id="star4" name="rating" value="4"><label for="star4">★</label>
                    <input type="radio" id="star3" name="rating" value="3"><label for="star3">★</label>
                    <input type="radio" id="star2" name="rating" value="2"><label for="star2">★</label>
                    <input type="radio" id="star1" name="rating" value="1"><label for="star1">★</label>
                </div>
            </div>
            <button type="submit" class="btn-submit">✅ 提交今日練習</button>
        </form>
    </div>
    <div class="card history-card">
        <h3 class="card-title">🏆 我的練習歷史紀錄</h3>
        <div id="statsDashboard" class="stats-dashboard"><div class="stat-item"><div class="stat-val" id="statDays">0</div><div class="stat-lbl">📆 累計練習天數</div></div><div class="stat-item"><div class="stat-val" id="statMinutes">0</div><div class="stat-lbl">⏱️ 累計練習分鐘</div></div></div>
        <div id="historyList" class="history-list"></div>
    </div>
</div>

<script>
    // #############################################
    // ##            請在這裡貼上您的              ##
    // ##      Google Apps Script 部署網址        ##
    // #############################################
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzWLtyVTK0t-nUHgFuEVqTMdhqJ1dN3agESUHHioY5O92-ABxLt34QXiKJAikkqeWAGVw/exec";
    
    // --- 以下為主要程式，請勿修改 ---
    const today = new Date();
    const dateStr = `${today.getFullYear()}年${String(today.getMonth() + 1).padStart(2, '0')}月${String(today.getDate()).padStart(2, '0')}日`;
    document.getElementById('todayDate').value = dateStr;

    // 錄音功能
    let mediaRecorder = null, audioChunks = [], recordedAudioBlob = null;
    const startBtn = document.getElementById('startBtn'), stopBtn = document.getElementById('stopBtn'), audioPlayback = document.getElementById('audioPlayback');
    startBtn.addEventListener('click', async () => {
        if (!navigator.mediaDevices) { alert("瀏覽器不支援錄音功能。"); return; }
        try {
            audioChunks = []; recordedAudioBlob = null;
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
            mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
            mediaRecorder.onstop = () => {
                recordedAudioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                audioPlayback.src = URL.createObjectURL(recordedAudioBlob);
                stream.getTracks().forEach(t => t.stop());
            };
            mediaRecorder.start();
            startBtn.disabled = true; stopBtn.disabled = false;
        } catch (err) { alert("無法存取麥克風，請檢查瀏覽器權限！"); }
    });
    stopBtn.addEventListener('click', () => { if (mediaRecorder) { mediaRecorder.stop(); startBtn.disabled = false; stopBtn.disabled = true; startBtn.innerText = "🔄 重新錄音"; }});

    // Base64 轉換
    function blobToBase64(blob) { return new Promise((resolve, reject) => { const reader = new FileReader(); reader.onloadend = () => resolve(reader.result.split(',')[1]); reader.onerror = reject; reader.readAsDataURL(blob); }); }

    // 表單提交
    document.getElementById('recordForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const submitBtn = e.target.querySelector('.btn-submit');
        const ratingInput = document.querySelector('input[name="rating"]:checked');
        if (!ratingInput) { alert("請自評今天表現！"); return; }
        submitBtn.disabled = true; submitBtn.innerText = "⏳ 傳送中...";
        try {
            let base64Audio = null, mimeType = null;
            if (recordedAudioBlob) { base64Audio = await blobToBase64(recordedAudioBlob); mimeType = recordedAudioBlob.type; }
            const payload = {
                className: document.getElementById('className').value, studentName: document.getElementById('studentName').value,
                date: dateStr, duration: parseInt(document.getElementById('practiceTime').value), content: document.getElementById('practiceContent').value,
                rating: parseInt(ratingInput.value), audioBase64: base64Audio, mimeType: mimeType
            };
            await fetch(GAS_WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            alert("🎉 提交成功！");
            e.target.reset();
            audioPlayback.src = '';
            recordedAudioBlob = null;
            loadHistory(); // 提交成功後重新載入紀錄
        } catch (err) { alert("❌ 傳送失敗，請檢查網路！"); } 
        finally { submitBtn.disabled = false; submitBtn.innerText = "✅ 提交今日練習"; }
    });

    // 讀取並顯示歷史紀錄
    function loadHistory() {
        const historyList = document.getElementById('historyList'), statsDashboard = document.getElementById('statsDashboard');
        const statDays = document.getElementById('statDays'), statMinutes = document.getElementById('statMinutes');
        historyList.innerHTML = '<div class="no-records">🔄 正在載入...</div>';
        fetch(GAS_WEB_APP_URL + "?action=getHistory")
            .then(res => res.json())
            .then(data => {
                if (data.result === "success" && data.history.length > 0) {
                    historyList.innerHTML = '';
                    let totalMinutes = 0; const uniqueDays = new Set();
                    data.history.reverse().forEach(rec => {
                        const item = document.createElement('div'); item.className = 'history-item';
                        const [practiceDate, studentName, ratingStars, practiceMins] = [rec[3], rec[2], rec[6], rec[4]];
                        item.innerHTML = `<div><strong>${practiceDate}</strong> - ${studentName}</div><div class="history-stars">${ratingStars || ''}</div>`;
                        historyList.appendChild(item);
                        totalMinutes += parseInt(practiceMins) || 0; uniqueDays.add(practiceDate);
                    });
                    statsDashboard.style.display = 'flex';
                    statDays.innerText = uniqueDays.size; statMinutes.innerText = totalMinutes;
                } else { historyList.innerHTML = '<div class="no-records">😢 尚未有練習紀錄。</div>'; }
            })
            .catch(err => { historyList.innerHTML = '<div class="no-records">❌ 讀取失敗！</div>'; });
    }
    document.addEventListener('DOMContentLoaded', loadHistory);
</script>
</body>
</html>
