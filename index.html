<script>
    // ⚠️【請替換為你第三步獲得的 Google Apps Script 網址】
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/YOUR_GAS_DEPLOYMENT_ID/exec";

    // ==========================================
    // 1. 初始化今日日期 (固定鎖定)
    // ==========================================
    const today = new Date();
    const year = today.getFullYear();
    const month = String(today.getMonth() + 1).padStart(2, '0');
    const date = String(today.getDate()).padStart(2, '0');
    const dateStr = `${year}年${month}月${date}日`;
    document.getElementById('todayDate').value = dateStr;

    // ==========================================
    // 2. 牧童笛指法與聲音頻率數據 (C4-E5 + F#4)
    // ==========================================
    const recorderData = {
        'C4': { name: '中音 Do', hz: 261.63, y: 95, stemUp: true, ledger: true,  sharp: false, holes: [1,1,1,1,1,1,1,1], tip: '🎵 C4 (中音 Do)：全部音孔都要按緊，溫和吹氣！' },
        'D4': { name: '中音 Re', hz: 293.66, y: 89, stemUp: true, ledger: false, sharp: false, holes: [1,1,1,1,1,1,1,0], tip: '🎵 D4 (中音 Re)：放開最底部的第 7 孔。' },
        'E4': { name: '中音 Mi', hz: 329.63, y: 83, stemUp: true, ledger: false, sharp: false, holes: [1,1,1,1,1,1,0,0], tip: '🎵 E4 (中音 Mi)：放開右手最底 6、7 兩孔。' },
        'F4': { name: '中音 Fa', hz: 349.23, y: 77, stemUp: true, ledger: false, sharp: false, holes: [1,1,1,1,1,0,1,1], tip: '⚠️ 巴洛克 Fa：右手按下 4,6,7 孔，放開第 5 孔！' },
        'F#4': { name: '中音 Fa# / F4#', hz: 369.99, y: 77, stemUp: true, ledger: false, sharp: true, holes: [1,1,1,1,0,1,1,0], tip: '✨ F#4 (升 Fa)：左手按 0,1,2,3 孔，右手放開第 4 孔，按緊 5,6 孔，第 7 孔放開。' },
        'G4': { name: '中音 Sol', hz: 392.00, y: 71, stemUp: true, ledger: false, sharp: false, holes: [1,1,1,1,0,0,0,0], tip: '🎵 G4 (中音 Sol)：左手按緊，右手全放開。' },
        'A4': { name: '中音 La', hz: 440.00, y: 65, stemUp: true, ledger: false, sharp: false, holes: [1,1,1,0,0,0,0,0], tip: '🎵 A4 (中音 La)：左手只需按 0,1,2 孔。' },
        'B4': { name: '中音 Ti', hz: 493.88, y: 59, stemUp: false, ledger: false, sharp: false, holes: [1,1,0,0,0,0,0,0], tip: '🎵 B4 (中音 Ti)：左手按 0,1 孔。' },
        'C5': { name: '高音 Do', hz: 523.25, y: 53, stemUp: false, ledger: false, sharp: false, holes: [1,0,1,0,0,0,0,0], tip: '🎵 C5 (高音 Do)：按住 0,2 孔，放開第 1 孔。' },
        'D5': { name: '高音 Re', hz: 587.33, y: 47, stemUp: false, ledger: false, sharp: false, holes: [0,0,1,0,0,0,0,0], tip: '🎵 D5 (高音 Re)：0 孔和 1 孔都放開，只按第 2 孔！' },
        'E5': { name: '高音 Mi', hz: 659.25, y: 41, stemUp: false, ledger: false, sharp: false, holes: [0.5,1,1,1,1,1,0,0], tip: '🔥 高音 Mi (E5)：背面的拇指 0 孔按一半 (◐)，其餘像 Mi 一樣按好。' }
    };

    // Web Audio 音效播放
    let audioCtx = null;
    function initAudioContext() {
        if (!audioCtx) {
            const AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }
    document.addEventListener('touchstart', initAudioContext, { once: true });
    document.addEventListener('click', initAudioContext, { once: true });

    function playTone(freq) {
        try {
            initAudioContext();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.05); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6); 
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.65);
        } catch (e) {
            console.log('Audio Context Error:', e);
        }
    }

    // 渲染五線譜與指法圖
    function updateVisualizer(noteKey) {
        const data = recorderData[noteKey];
        if (!data) return;
        document.getElementById('fingeringTip').innerHTML = `<strong>${noteKey} (${data.name}) 指法：</strong><br>${data.tip}`;
        const noteHead = document.getElementById('noteHead');
        const noteStem = document.getElementById('noteStem');
        const ledgerLine = document.getElementById('ledgerLine');
        const sharpSign = document.getElementById('sharpSign');

        noteHead.setAttribute('cy', data.y);
        noteHead.setAttribute('transform', `rotate(-15, 120, ${data.y})`);
        ledgerLine.style.display = data.ledger ? 'block' : 'none';

        if (data.sharp) {
            sharpSign.style.display = 'block';
            sharpSign.setAttribute('y', data.y + 8); 
        } else {
            sharpSign.style.display = 'none';
        }

        if (data.stemUp) {
            noteStem.setAttribute('x1', '126');
            noteStem.setAttribute('y1', data.y);
            noteStem.setAttribute('x2', '126');
            noteStem.setAttribute('y2', data.y - 32);
        } else {
            noteStem.setAttribute('x1', '114');
            noteStem.setAttribute('y1', data.y);
            noteStem.setAttribute('x2', '114');
            noteStem.setAttribute('y2', data.y + 32);
        }

        for (let i = 0; i <= 7; i++) {
            const hole = document.getElementById(`hole${i}`);
            const state = data.holes[i];
            if (state === 1) hole.setAttribute('fill', '#333');
            else if (state === 0.5) hole.setAttribute('fill', 'url(#halfGrad)');
            else hole.setAttribute('fill', '#fff');
        }
    }

    const noteSelector = document.getElementById('noteSelector');
    let firstNote = 'C4';
    Object.keys(recorderData).forEach((note) => {
        const btn = document.createElement('div');
        btn.className = `note-btn ${note === firstNote ? 'active' : ''}`;
        btn.innerText = note;
        btn.addEventListener('click', () => {
            document.querySelectorAll('.note-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            playTone(recorderData[note].hz);
            updateVisualizer(note);
        });
        noteSelector.appendChild(btn);
    });
    updateVisualizer(firstNote);

    // ==========================================
    // 3. 錄音功能實現 (解決 iPad Safari 授權問題)
    // ==========================================
    let mediaRecorder = null;
    let audioChunks = [];
    let audioStream = null;
    let recordedAudioBlob = null; // 保存錄音 Blob

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const audioPlayback = document.getElementById('audioPlayback');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    startBtn.addEventListener('click', async () => {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            alert("⚠️ 瀏覽器未開放麥克風權限。請確保網頁經由 HTTPS 開啟（例如 GitHub Pages）。");
            return;
        }

        try {
            audioChunks = [];
            recordedAudioBlob = null;
            audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });

            let options = {};
            if (typeof MediaRecorder.isTypeSupported === 'function') {
                if (MediaRecorder.isTypeSupported('audio/mp4')) options = { mimeType: 'audio/mp4' };
                else if (MediaRecorder.isTypeSupported('audio/aac')) options = { mimeType: 'audio/aac' };
                else if (MediaRecorder.isTypeSupported('audio/webm')) options = { mimeType: 'audio/webm' };
            }

            mediaRecorder = new MediaRecorder(audioStream, options);

            mediaRecorder.ondataavailable = event => {
                if (event.data && event.data.size > 0) audioChunks.push(event.data);
            };

            mediaRecorder.onstop = () => {
                const mimeTypeUsed = mediaRecorder.mimeType || 'audio/mp4';
                recordedAudioBlob = new Blob(audioChunks, { type: mimeTypeUsed });
                audioPlayback.src = URL.createObjectURL(recordedAudioBlob);

                if (audioStream) audioStream.getTracks().forEach(track => track.stop());

                statusDot.classList.remove('active');
                statusText.innerText = "⏺️ 錄音完成！可點擊播放試聽";
            };

            mediaRecorder.start(1000); 
            startBtn.disabled = true;
            stopBtn.disabled = false;
            statusDot.classList.add('active');
            statusText.innerText = "🔴 正在錄音中...請開始吹奏...";
        } catch (err) {
            console.error('錄音失敗:', err);
            alert("🔒 無法存取麥克風。如果在 Google Sites 或 iPad 上，請確保已允許麥克風權限！");
        }
    });

    stopBtn.addEventListener('click', () => {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
            startBtn.disabled = false;
            stopBtn.disabled = true;
            startBtn.innerText = "🔄 重新錄音";
        }
    });

    // ==========================================
    // 4. 本地歷史紀錄與成就統計
    // ==========================================
    const STORAGE_KEY = 'recorder_logs_v2';
    function getLogs() {
        try {
            const logs = localStorage.getItem(STORAGE_KEY);
            return logs ? JSON.parse(logs) : [];
        } catch(e) { return []; }
    }

    function saveLog(log) {
        const logs = getLogs();
        logs.unshift(log); 
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(logs)); } catch(e) {}
    }

    function renderHistory() {
        const historyList = document.getElementById('historyList');
        const statsDashboard = document.getElementById('statsDashboard');
        const logs = getLogs();

        if (logs.length === 0) {
            statsDashboard.style.display = 'none';
            historyList.innerHTML = '<div class="no-records">你還沒有任何練習紀錄唷！快完成今天的第一次練習吧！🌟</div>';
            return;
        }

        statsDashboard.style.display = 'flex';
        const uniqueDays = new Set(logs.map(item => item.date)).size;
        const totalMinutes = logs.reduce((sum, item) => sum + item.duration, 0);
        document.getElementById('statDays').innerText = uniqueDays;
        document.getElementById('statMinutes').innerText = totalMinutes;

        historyList.innerHTML = logs.map(item => {
            const isToday = item.date === dateStr;
            return `
                <div class="history-item" style="${isToday ? 'border-left-color: var(--primary);' : 'border-left-color: #a0aec0;'}">
                    <div class="history-info">
                        <span class="history-date-badge ${isToday ? 'today' : ''}">
                            ${item.date} ${isToday ? '🔥 今日練習' : '📅 往日紀錄'}
                        </span>
                        <h4 style="margin: 4px 0;">⏱️ 練習了 ${item.duration} 分鐘</h4>
                        <p>🎯 內容：${escapeHtml(item.content)}</p>
                    </div>
                    <div class="history-stars">
                        ${'★'.repeat(item.rating)}${'☆'.repeat(5 - item.rating)}
                    </div>
                </div>
            `;
        }).join('');
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
    renderHistory();

    // ==========================================
    // 5. 數據傳送至 Google Sheets (含 Base64 錄音)
    // ==========================================
    function blobToBase64(blob) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result.split(',')[1]);
            reader.onerror = reject;
            reader.readAsDataURL(blob);
        });
    }

    document.getElementById('recordForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const submitBtn = document.querySelector('.btn-submit');
        const duration = parseInt(document.getElementById('practiceTime').value);
        const content = document.getElementById('practiceContent').value;
        const ratingInput = document.querySelector('input[name="rating"]:checked');

        if (!ratingInput) {
            alert("⚠️ 請先自評今天表現（點選星星）！");
            return;
        }

        if (GAS_WEB_APP_URL.includes("YOUR_GAS_DEPLOYMENT_ID")) {
            alert("⚠️ 請先在 index.html 內把 GAS_WEB_APP_URL 替換為你的 Google Apps Script 網址！");
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = "⏳ 正在傳送紀錄至 Google Sheets...";

        try {
            let base64Audio = null;
            let mimeType = "audio/mp4";

            if (recordedAudioBlob) {
                base64Audio = await blobToBase64(recordedAudioBlob);
                mimeType = recordedAudioBlob.type;
            }

            const payload = {
                date: dateStr,
                duration: duration,
                content: content,
                rating: parseInt(ratingInput.value),
                audioBase64: base64Audio,
                mimeType: mimeType
            };

            await fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            alert("🎉 提交成功！你的練習紀錄與錄音已成功傳送至老師的 Google Sheets！");

            saveLog({
                date: dateStr,
                duration: duration,
                content: content,
                rating: parseInt(ratingInput.value),
                timestamp: Date.now()
            });
            renderHistory();

            document.getElementById('practiceTime').value = '';
            document.getElementById('practiceContent').value = '';
            document.querySelectorAll('input[name="rating"]').forEach(el => el.checked = false);
            audioPlayback.src = '';
            recordedAudioBlob = null;

        } catch (err) {
            console.error("提交失敗:", err);
            alert("❌ 傳送失敗，請檢查網路連線或稍後再試！");
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "✅ 提交今日練習";
        }
    });
</script>
