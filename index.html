<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牧童笛練習打卡系統 - v9.0 終極版</title>
    <style>
        :root { --primary: #2c7a7b; --primary-light: #e6fffa; --dark: #2d3748; --light: #f7fafc; --white: #ffffff; --error: #e53e3e; }
        body { background-color: #f0f7f6; margin: 0; padding: 15px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft JhengHei", sans-serif; }
        .app-container { max-width: 700px; margin: 0 auto; }
        .card { background: var(--white); border-radius: 16px; box-shadow: 0 4px H20px rgba(0,0,0,0.06); padding: 25px; margin-bottom: 20px;}
        .card-title { color: var(--primary); font-size: 1.5rem; margin: 0 0 25px 0; border-bottom: 2px solid var(--primary-light); padding-bottom: 15px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; color: #4a5568; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 1rem; outline: none; transition: border-color 0.2s; box-sizing: border-box; }
        textarea { resize: none; overflow-y: hidden; }
        input:focus, textarea:focus { border-color: var(--primary); }
        input[readonly] { background-color: #edf2f7; cursor: not-allowed; }
        .star-rating { display: flex; flex-direction: row-reverse; justify-content: center; gap: 5px;}
        .star-rating input { display: none; }
        .star-rating label { font-size: 38px; color: #e2e8f0; cursor: pointer; transition: color 0.2s; }
        .star-rating input:checked ~ label, .star-rating label:hover, .star-rating label:hover ~ label { color: #f6e05e; }
        .recorder-box { background: #ebf8fa; border-radius: 12px; padding: 20px; text-align: center; }
        button { padding: 12px 20px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 1rem; transition: background-color 0.2s; }
        .btn-record { background-color: var(--error); color: var(--white); }
        .btn-stop { background-color: #4a5568; color: var(--white); }
        .btn-submit { background-color: var(--primary); color: var(--white); width: 100%; padding: 15px; font-size: 1.1rem; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        audio { width: 100%; margin-top: 15px; }
        .history-list { max-height: 400px; overflow-y: auto; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #e8f3f3; }
        .history-content { flex-grow: 1; word-break: break-word; line-height: 1.5; }
        .history-stars { color: #f6e05e; font-size: 1.1rem; flex-shrink: 0; margin-left: 15px; }
        .no-records { text-align: center; color: #a0aec0; padding: 25px; }
        @media (max-width: 600px) { .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div class="app-container">
    <div class="card">
        <h3 class="card-title">🎵 牧童笛練習打卡系統</h3>
        <form id="recordForm">
            <div class="form-row">
                <div class="form-group"><label for="className">🏫 班別</label><input type="text" id="className" required></div>
                <div class="form-group"><label for="studentName">👤 學生姓名</label><input type="text" id="studentName" required></div>
            </div>
            <div class="form-group"><label>📅 練習日期</label><input type="text" id="todayDate" readonly></div>
            <div class="form-group"><label for="practiceTime">⏱️ 練習時間 (分鐘)</label><input type="number" id="practiceTime" min="5" max="120" placeholder="5-120 分鐘" required></div>
            <div class="form-group"><label for="practiceContent">📝 練習內容</label><textarea id="practiceContent" rows="1" required></textarea></div>
            <div class="recorder-box">
                <p style="margin:0 0 10px 0; font-weight:600;">🎙️ 錄下我的演奏 (選填)</p>
                <div style="display:flex; gap: 10px; justify-content: center;">
                    <button type="button" id="startBtn" class="btn-record">🔴 開始</button>
                    <button type="button" id="stopBtn" class="btn-stop" disabled>⏹️ 停止</button>
                </div>
                <audio id="audioPlayback" controls></audio>
            </div>
            <div class="form-group" style="text-align:center;">
                <label style="margin-bottom:10px;">⭐ 請自評今天表現</label>
                <div class="star-rating">
                    <input type="radio" id="star5" name="rating" value="5" required><label for="star5">★</label>
                    <input type="radio" id="star4" name="rating" value="4"><label for="star4">★</label>
                    <input type="radio" id="star3" name="rating" value="3"><label for="star3">★</label>
                    <input type="radio" id="star2" name="rating" value="2"><label for="star2">★</label>
                    <input type="radio" id="star1" name="rating" value="1"><label for="star1">★</label>
                </div>
            </div>
            <button type="submit" class="btn-submit">✅ 提交今日練習</button>
        </form>
    </div>
    <div class="card">
        <h3 class="card-title">🏆 我的練習歷史紀錄</h3>
        <div id="historyList" class="history-list"></div>
    </div>
</div>

<script>
    // --- 1. 您的 Apps Script 部署網址 ---
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzsi2zDwP3QB2TOLC7TZ2pzF7KgbcdeOZMNEAAuRL-91hWs709HAwHenJIHa9ktcgntlA/exec";
    
    // --- 2. 自動填入今天日期 ---
    const today = new Date();
    const dateStr = `${today.getFullYear()}年${String(today.getMonth() + 1).padStart(2, '0')}月${String(today.getDate()).padStart(2, '0')}日`;
    document.getElementById('todayDate').value = dateStr;

    // --- 3. 練習內容輸入框自動增高 ---
    const textarea = document.getElementById('practiceContent');
    textarea.addEventListener('input', () => {
        textarea.style.height = 'auto';
        textarea.style.height = (textarea.scrollHeight) + 'px';
    });

    // --- 4. 錄音功能 ---
    let mediaRecorder, audioChunks = [], recordedAudioBlob;
    // (詳細錄音程式碼省略，但已包含在下方完整實現中)

    // --- 5. 讀取歷史紀錄功能 (GET) ---
    function loadHistory() {
        const historyList = document.getElementById('historyList');
        historyList.innerHTML = '<div class="no-records">🔄 載入中...</div>';
        fetch(`${GAS_WEB_APP_URL}?action=getHistory`)
            .then(res => res.json())
            .then(data => {
                if (data.result === "success" && data.history.length > 0) {
                    historyList.innerHTML = '';
                    data.history.reverse().forEach(rec => {
                        const item = document.createElement('div');
                        item.className = 'history-item';
                        
                        // 【v9.0 核心修正】
                        // rec[3] 是日期, rec[5] 是內容, rec[6] 是星級
                        // 檢查 rec[3] 是否為 ISO 格式的日期字串
                        let displayDate = rec[3];
                        if (typeof rec[3] === 'string' && rec[3].includes('T')) {
                            const d = new Date(rec[3]);
                            displayDate = `${d.getFullYear()}年${String(d.getMonth() + 1).padStart(2, '0')}月${String(d.getDate()).padStart(2, '0')}日`;
                        }

                        item.innerHTML = `<div class="history-content"><strong>${displayDate}</strong><br><small>${rec[5]}</small></div><div class="history-stars">${rec[6]}</div>`;
                        historyList.appendChild(item);
                    });
                } else { historyList.innerHTML = '<div class="no-records">😢 尚未有紀錄。</div>'; }
            })
            .catch(err => { historyList.innerHTML = '<div class="no-records">❌ 讀取失敗，請確認 Apps Script 已正確部署。</div>'; });
    }
    
    // --- 6. 頁面載入時，自動執行 ---
    document.addEventListener('DOMContentLoaded', () => {
        loadHistory();
        
        // 重新實現錄音與表單提交的詳細邏輯
        const startBtn = document.getElementById('startBtn'), stopBtn = document.getElementById('stopBtn'), audioPlayback = document.getElementById('audioPlayback');
        startBtn.addEventListener('click', async () => { /* ... */ });
        stopBtn.addEventListener('click', () => { /* ... */ });
        const form = document.getElementById('recordForm');
        form.addEventListener('submit', async (e) => { /* ... */ });

        // 完整實現
        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = []; mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    recordedAudioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    audioPlayback.src = URL.createObjectURL(recordedAudioBlob);
                    stream.getTracks().forEach(t => t.stop());
                };
                mediaRecorder.start(); startBtn.disabled = true; stopBtn.disabled = false;
            } catch (err) { alert("無法存取麥克風，請檢查瀏覽器權限。"); }
        });
        stopBtn.addEventListener('click', () => { if (mediaRecorder) { mediaRecorder.stop(); startBtn.disabled = false; stopBtn.disabled = true; } });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = form.querySelector('.btn-submit');
            submitBtn.disabled = true; submitBtn.innerText = "⏳ 傳送中...";
            let audioBase64 = null;
            if (recordedAudioBlob) {
                audioBase64 = await new Promise(resolve => {
                    const reader = new FileReader(); reader.onloadend = () => resolve(reader.result.split(',')[1]); reader.readAsDataURL(recordedAudioBlob);
                });
            }
            const payload = {
                className: form.className.value, studentName: form.studentName.value, date: dateStr,
                duration: form.practiceTime.value, content: form.practiceContent.value,
                rating: form.rating.value, audioBase64: audioBase64, mimeType: 'audio/webm'
            };
            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST', body: JSON.stringify(payload), headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });
                const textResponse = await response.text();
                const result = JSON.parse(textResponse);
                if (result.result === "success") {
                    alert("🎉 提交成功！"); form.reset(); audioPlayback.src = ''; recordedAudioBlob = null; textarea.style.height = 'auto'; loadHistory();
                } else { throw new Error(result.message || "後端錯誤"); }
            } catch (err) {
                alert(`❌ 傳送失敗，請稍後再試。`);
            } finally {
                submitBtn.disabled = false; submitBtn.innerText = "✅ 提交今日練習";
            }
        });
    });
</script>
</body>
</html>
